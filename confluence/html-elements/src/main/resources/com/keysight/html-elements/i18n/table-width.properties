#put any key/value pairs here
com.keysight.html-elements.table-width.label = Table and Column Width
com.keysight.html-elements.table-width.desc = This macro provides a workaround to set the column sizes for a Confluence Table.<br /><a href="#" onclick="htmlElementsHelp.showTableWidthHelp( event );">Documentation</a>
com.keysight.html-elements.table-width.param.table-width.label = Table Width 
com.keysight.html-elements.table-width.param.table-width.desc = Example: 90% or 400px 
com.keysight.html-elements.table-width.param.column-widths.label = Column Widths 
com.keysight.html-elements.table-width.param.column-widths.desc = A comma seperated list of the desired widths, such as 100px,200px or 80%,20%
com.keysight.html-elements.table-width.param.row.label = Row 
com.keysight.html-elements.table-width.param.row.desc = The table row the sizes should be applied to.  Used to select a row that does not have merged cells.
