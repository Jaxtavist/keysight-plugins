#input any key/value pairs here

com.keysight.include-content.code-include.label = Include Code
com.keysight.include-content.code-include.desc = Macro to format blocks of source-code received from a URL.<br /><a href="#" onclick="includeContentHelp.showIncludeCodeHelp( event );" >Documentation</a>
com.keysight.include-content.code-include.param.url.label = URL
com.keysight.include-content.code-include.param.url.desc = Should be a full url that pulls in a plain text code fragment
com.keysight.include-content.code-include.param.username.label = Username
com.keysight.include-content.code-include.param.username.desc = Username if the website requires credentials
com.keysight.include-content.code-include.param.password.label = Password
com.keysight.include-content.code-include.param.password.desc = Password if the website requires credentials
com.keysight.include-content.code-include.param.language.label = Syntax highlighting
com.keysight.include-content.code-include.param.title.label = Title
com.keysight.include-content.code-include.param.collapse.label = Collapsible
com.keysight.include-content.code-include.param.linenumbers.label = Show line numbers
com.keysight.include-content.code-include.param.firstline.label = First line number
com.keysight.include-content.code-include.param.theme.label = Theme
com.keysight.include-content.code-include.param.start-regex.label = Start Line Regex
com.keysight.include-content.code-include.param.start-regex.desc = A regular expression for the first line to include
com.keysight.include-content.code-include.param.exclude-first-matched-line.label = Exclude First Matched Line
com.keysight.include-content.code-include.param.end-regex.label = End Line Regex
com.keysight.include-content.code-include.param.end-regex.desc = A regular expression to match the last line to include
com.keysight.include-content.code-include.param.include-last-matched-line.label = Include Last Matched Line
com.keysight.include-content.code-include.param.initial-line.label = Initial Line
com.keysight.include-content.code-include.param.initial-line.desc = Prepend this line to the included text, for example "...".  Use "\\n" to include a line return.
com.keysight.include-content.code-include.param.final-line.label = Final Line
com.keysight.include-content.code-include.param.final-line.desc = Append this line to the included text, for example "...". Use "\\n" to include a line return.
com.keysight.include-content.code-include.param.join-line.label = Join Line 
com.keysight.include-content.code-include.param.join-line.desc = Insert this line between multiple matched sections.  Use "\\n" to include a line return.
com.keysight.include-content.code-include.param.multiple-regions.label = Multiple Regions
com.keysight.include-content.code-include.param.multiple-regions.desc = Include all of the regions bounded by the start and end regular expressions
