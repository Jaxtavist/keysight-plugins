com.keysight.html-elements.compact-form.label=Compact Form
com.keysight.html-elements.compact-form.desc=Macro to create an simple form.  The form elements are defined in the body of the macro using plain text.  See the <a href="#" onclick="htmlElementsHelp.showCompactFormHelp( event );">Documentation.</a> for syntax details.
com.keysight.html-elements.compact-form.param.style.label = Form Style
com.keysight.html-elements.compact-form.param.url.label = URL
com.keysight.html-elements.compact-form.param.url.desc = The url target of the form
com.keysight.html-elements.compact-form.param.target.label = Form Target
com.keysight.html-elements.compact-form.param.target.desc = Open the new url in the same window or a new tab/window
com.keysight.html-elements.compact-form.param.submit.label = Submit Button Text
com.keysight.html-elements.compact-form.param.submit.desc = The text to display on the submit button
com.keysight.html-elements.compact-form.param.form-layout.label = AUI Form Layout
com.keysight.html-elements.compact-form.param.form-layout.desc = Sets the AUI Form Layout (AUI Style Only)
com.keysight.html-elements.compact-form.param.seperator.label = Form Element Seperator
com.keysight.html-elements.compact-form.param.seperator.desc = String to join elements by, such as line break "&lt;br /&gt;" (Plain HTML Style Only)
com.keysight.html-elements.compact-form.param.alignment.label = Form Alignment
com.keysight.html-elements.compact-form.param.alignment.desc = (Plain HTML Style Only)
com.keysight.html-elements.compact-form.param.submit-seperator.label = Submit Button Element Seperator 
com.keysight.html-elements.compact-form.param.submit-seperator.desc = Defaults to the Form Element Seperator.  Will be placed before the submit button. (Plain HTML Style Only)
com.keysight.html-elements.compact-form.param.submit-alignment.label = Submit Button Alignment
com.keysight.html-elements.compact-form.param.submit-alignment.desc = Defaults to the form alignment (Plain HTML Style Only)
